name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Kerberos development headers
        # The msad dependency builds gssapi against the system krb5 libraries.
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: ruff check
        run: make lint-check

      - name: ruff format --check
        run: make lint-format

      - name: pyrefly (strict)
        run: make typecheck

  build:
    name: Build distribution
    needs: lint
    # Only build when it's useful: on tag pushes (releases) or manual runs.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from Git tags; it needs full history.
          fetch-depth: 0

      - name: Install Kerberos development headers
        # The msad dependency builds gssapi against the system krb5 libraries.
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: make build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    # Publish only on version tags.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mcpad/
    # Trusted Publishing (OIDC): no API token/secret needed. Configure the
    # publisher on PyPI: project settings -> Publishing -> add this repo +
    # workflow (ci.yml) + environment (pypi).
    permissions:
      id-token: write
    steps:
      - name: Download built distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Publish
        run: uv publish dist/*

  mcp-registry:
    name: Publish to MCP Registry
    needs: publish
    # Skip pre-releases (alpha/beta/rc tags)
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC login to the MCP Registry (no secrets needed)
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4

      - name: Set version in server.json from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json

      - name: Wait until PyPI serves the new version with the mcp-name marker
        run: |
          PKG=$(jq -r '.packages[0].identifier' server.json)
          VER=$(jq -r '.version' server.json)
          NAME=$(jq -r '.name' server.json)
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/$PKG/$VER/json" | grep -q "mcp-name: $NAME"; then exit 0; fi
            echo "waiting for PyPI ($i/30)..."; sleep 10
          done
          echo "PyPI did not expose $PKG $VER with marker"; exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
