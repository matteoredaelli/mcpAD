[project]
name = "mcpad"
version = "0.1.0"
description = "A FastMCP server exposing the msad Active Directory / LDAP library"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Matteo Redaelli", email = "matteo.redaelli@gmail.com" }
]
keywords = ["active-directory", "ldap", "mcp", "kerberos", "ad"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration :: Authentication/Directory :: LDAP",
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.9",
    "msad>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/matteoredaelli/mcpAD"
Repository = "https://github.com/matteoredaelli/mcpAD"
Issues = "https://github.com/matteoredaelli/mcpAD/issues"

[project.scripts]
mcpad = "mcpad:main"

[tool.uv.sources]
# Development-only override: use the local msad checkout. This is NOT included
# in the published package; installers resolve `msad>=0.5.0` from the index.
msad = { path = "/Users/redaema001/Downloads/github/msad", editable = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pyrefly>=0.16",
]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "W",   # pycodestyle warnings
]

[tool.ruff.format]
docstring-code-format = true

[tool.pyrefly]
project-includes = ["src"]
python-version = "3.11"
preset = "strict"
